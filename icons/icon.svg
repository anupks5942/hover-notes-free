<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0d0d15"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a882ff"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg-grad)" stroke="#33334d" stroke-width="2.5"/>

  <!-- Note notebook shape -->
  <rect x="26" y="24" width="68" height="80" rx="8" fill="#222233" stroke="url(#primary-grad)" stroke-width="3"/>
  
  <!-- Spiral binding dots on left -->
  <circle cx="34" cy="38" r="3" fill="#a882ff"/>
  <circle cx="34" cy="54" r="3" fill="#a882ff"/>
  <circle cx="34" cy="70" r="3" fill="#a882ff"/>
  <circle cx="34" cy="86" r="3" fill="#a882ff"/>

  <!-- Note text lines -->
  <rect x="44" y="36" width="40" height="4" rx="2" fill="#4facfe" opacity="0.9"/>
  <rect x="44" y="48" width="32" height="4" rx="2" fill="#8888aa" opacity="0.7"/>
  <rect x="44" y="60" width="36" height="4" rx="2" fill="#8888aa" opacity="0.7"/>
  <rect x="44" y="72" width="24" height="4" rx="2" fill="#8888aa" opacity="0.7"/>

  <!-- Play Badge bottom right -->
  <circle cx="88" cy="86" r="20" fill="url(#primary-grad)" filter="url(#glow)"/>
  <polygon points="83,76 97,86 83,96" fill="#ffffff"/>

  <!-- Sparkle / AI star top right -->
  <path d="M 96 20 L 98 28 L 106 30 L 98 32 L 96 40 L 94 32 L 86 30 L 94 28 Z" fill="url(#accent-grad)" filter="url(#glow)"/>
</svg>